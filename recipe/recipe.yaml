schema_version: 1

context:
  name: hgdl
  version: 2.4.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/lbl-camera/HGDL/archive/${{ version }}.tar.gz
  sha256: f79475b08b0e569dd273f0aac7c99eb6855a50f5ff3010c44845c07cfa9b16e8

build:
  number: 0
  noarch: python
  script: SETUPTOOLS_SCM_PRETEND_VERSION=${{ version }} ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - wheel
    - scipy >=1.13
    - numpy >=2.1
    - dask-core >=2024.1
    - distributed >=2024.1
    - loguru
tests:
  - python:
      imports:
        - hgdl
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: API for Distributed HPC Function Optimization
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/lbl-camera/HGDL

extra:
  recipe-maintainers:
    - jan-janssen
